# ============================================================
#  HFsystemMap - csempeszerver beallitasai
#  A program inditaskor olvassa be (az exe melletti fajlt).
#  Modositas utan a programot ujra kell inditani.
# ============================================================

Name=HFsystemMap
Copyright=© OpenStreetMap - Map data ©2024 OpenStreetMap

# --- Csempeszerver ---------------------------------------------
# A letoltott cim:  {Protocol}://{ServerIp}:{ServerPort}/{TilePath}/{z}/{x}/{y}.{TileFormat}
# pl.:              http://192.168.50.1:80/data/v3/10/567/358.pbf

# http vagy https
Protocol=http
# A szerver IP cime vagy gepneve
ServerIp=192.168.50.1
# A szerver portja (ures = alapertelmezett: http 80, https 443)
ServerPort=80
# Utvonal a szerveren a {z}/{x}/{y} elott (ures is lehet)
TilePath=data/v3
# Csempe formatum:
#   pbf vagy mvt = vektoros csempe, a program rajzolja ki
#   png vagy jpg = kesz kep a szervertol (pl. TilePath=styles/basic-preview)
TileFormat=pbf
# A vektoros csempek legnagyobb zoomszintje a szerveren;
# e felett a program a legnagyobb szintu csempet nagyitja
MaxVectorZoom=14

# Halado: teljes URL minta, ha a fenti reszekbol nem rakhato ossze.
# Ha meg van adva, felulirja a Protocol/TilePath/TileFormat ertekeket.
# {0}=ServerIp:ServerPort, {1}=zoom, {2}=x, {3}=y
UrlFormat=

# --- Kezdonezet ------------------------------------------------
# Ha mindharom meg van adva, a program MINDIG itt indul a HFsystemMap
# terkeppel (a legutobb elmentett nezet helyett). Ures = a legutobbi nezet.
# Tizedesjel: pont. Most: a 10/567/358 csempe kozepe (Monor kornyeke).
StartLatitude=47.39835
StartLongitude=19.51172
StartZoom=10

# --- Retegek (csak pbf/mvt csempe eseten) ------------------------
# Indulaskor ezek a retegek latszanak (1 = be, 0 = ki).
# Futas kozben a terkeptipus melletti "Retegek" gombbal kapcsolhatok.
# Teruletek
Layer.Water=1
Layer.Vegetation=1
Layer.Landuse=1
Layer.Buildings=1
# Vonalak
Layer.Roads=1
Layer.Paths=1
Layer.Railways=1
Layer.Boundaries=1
# Feliratok
Layer.PlaceNames=1
Layer.StreetNames=1
Layer.WaterNames=1
# Hazszamok csak 17-es zoomtol latszanak
Layer.HouseNumbers=1

# --- Cimkereses (Find address gomb) -----------------------------
# HTTP GET keres, csak a HFsystemMap terkepre vonatkozik.
# {0} = a beirt szoveg URL-kodolva, pl. Budapest, Szent%20Endre
# Valasz: {"name":"Budapest","lat":47.4984,"lon":19.0405} vagy ilyenek tombje [ {...}, ... ]
GeocoderUrlFormat=http://localhost:537/settlement/{0}
GeocoderDetailedUrlFormat=http://localhost:537/search?street={0}&city={1}&county={2}&state={3}&country={4}&postalcode={5}&format=json
ReverseGeocoderUrlFormat=http://localhost:537/position/{0}/{1}

# --- Egyeb -----------------------------------------------------
RefererUrl=
YoursClientName=
